# Full stack: BFF + frontend.
# The frontend lives in the sibling repo (../romania-budget-dashboard).
#
# Usage:
#   cp .env.example .env      # then adjust as needed (e.g. DATA_SOURCE=hackforfacts)
#   docker compose up -d --build
#   open http://localhost:8080
#
# VITE_API_BASE_URL is baked into the frontend at build time and must be the
# URL the *browser* uses to reach the BFF (defaults to http://localhost:3000).

services:
  bff:
    build: .
    image: romania-budget-dashboard-bff:latest
    env_file: .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../romania-budget-dashboard
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    image: romania-budget-dashboard:latest
    ports:
      - "8080:80"
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
