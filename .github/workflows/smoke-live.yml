name: Smoke (live API)

# Exercises the hackforfacts integration against the public transparenta.eu
# API. Run manually from the Actions tab or daily — it is intentionally not
# part of the PR pipeline because it depends on a third-party service.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: smoke live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Smoke test against the live API
        run: pnpm smoke:live
      - name: Smoke the deployed API
        run: |
          set -euo pipefail
          for path in /api/health /api/budget/years "/api/salary/calculate?gross=9427"; do
            curl -fsS --max-time 30 "https://budget.cristian-nichifor.com$path" > /dev/null
          done
      - name: Open or update an issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live smoke failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled live smoke failed: $RUN_URL"
          fi
